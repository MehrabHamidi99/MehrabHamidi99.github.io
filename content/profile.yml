    title: Geometry & optimization
    text: Studying the structure of neural representations and loss landscapes to understand learning dynamics and improve optimization.
    tags: [Deep learning theory, Optimization]
  - number: '02'
    title: Mechanistic interpretability
    text: Connecting a model's internal computations to its behavior, with a focus on vision-based agents and sequential decisions.
    tags: [Interpretability, Agent behavior]
  - number: '03'
    title: Temporal reasoning
    text: Designing controlled benchmarks that reveal how graph models handle memory, delayed effects, and long-range dependencies.
    tags: [Graph learning, Evaluation]
